name: Build Profile README

on:
  # 每天 03:17 UTC（避开整点高峰）自动刷新
  schedule:
    - cron: "17 3 * * *"
  # 允许手动触发
  workflow_dispatch:
  # 脚本或模板变更时立即重建
  push:
    branches: [main]
    paths:
      - "build_readme.mjs"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: "build-readme"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 零依赖，无需 npm install
      - name: Build README
        run: node build_readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "结果：README 无变化，跳过提交。"
            exit 0
          fi

          echo "结果：README 有变化，准备提交。"
          git commit -m "chore: 自动刷新门面 [skip ci]"

          # 期间若有人推送过，先变基再重试，避免 non-fast-forward 直接失败
          for attempt in 1 2 3; do
            if git push; then
              echo "结果：推送成功（第 $attempt 次尝试）。"
              exit 0
            fi
            echo "结果：推送被拒，变基后重试（第 $attempt 次）。"
            git pull --rebase origin main
          done

          echo "结果：推送连续失败，请人工检查。" >&2
          exit 1
