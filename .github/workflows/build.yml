name: Build Profile README

on:
  # 每天 03:17 UTC（避开整点高峰）自动刷新
  schedule:
    - cron: "17 3 * * *"
  # 允许手动触发
  workflow_dispatch:
  # 脚本或模板变更时立即重建
  push:
    branches: [main]
    paths:
      - "build_readme.mjs"
      - "README.md"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: "build-readme"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 零依赖，无需 npm install
      - name: Build README
        run: node build_readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交。"
          else
            git commit -m "chore: 自动刷新门面 [skip ci]"
            git push
          fi
